plugins {
    id "java"
    id "architectury-plugin" version "3.4-SNAPSHOT" apply false
    id "dev.architectury.loom" version "1.6-SNAPSHOT" apply false
}

allprojects {
    group = "com.hyperion"
    version = "1.0.2"

    apply plugin: "java"

    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
    }
}

// Version-specific Java target bytecode compatibility
project(":common") {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 8 // Maximum backwards-compatibility across all MC versions
    }
}

project(":fabric-1.16.5") { tasks.withType(JavaCompile).configureEach { options.release = 8 } }
project(":forge-1.16.5")  { tasks.withType(JavaCompile).configureEach { options.release = 8 } }

