subprojects {
    apply plugin: "java"

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    dependencies {
        compileOnly files(requiredJars)
        testImplementation files(requiredJars)
    }

    if (project.name != "common" && project.name != "compile-stubs") {
        dependencies {
            implementation project(":compile-stubs")
            implementation project(":common")
        }
    }
}

project(":compile-stubs") {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    dependencies {
        compileOnly files(requiredJars)
    }
}

project(":common") {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    dependencies {
        implementation project(":compile-stubs")
        compileOnly files(requiredJars)
        testImplementation files(requiredJars)
    }
}

